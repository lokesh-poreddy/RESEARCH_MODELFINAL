[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --ignore=tests/test_hf_live.py
asyncio_mode = auto

markers =
    CORE: Canonical RF-1 behavior. Runs on every commit. Failure blocks release.
    COMPATIBILITY: Legacy API/serialization deliberately preserved. Must pass, but tests archived code.
    LEGACY: Historical code retained as research evidence. Not supported product path.
